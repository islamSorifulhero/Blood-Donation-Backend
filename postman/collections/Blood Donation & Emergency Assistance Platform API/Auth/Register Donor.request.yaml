    {
      "name": "Rahim Uddin",
      "email": "donor1@example.com",
      "phone": "+8801700000001",
      "password": "Passw0rd!",
      "bloodGroup": "O_POSITIVE",
      "dateOfBirth": "1998-05-10",
      "gender": "MALE",
      "weightKg": 68,
      "address": "House 12, Road 5, Dhanmondi",
      "city": "Dhaka",
      "latitude": 23.7461,
